<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Objectifs</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)">
<style>
:root {
  color-scheme: light;
  --page: #f6f5f1; --card: #ffffff; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
  --track: #e8e7e1; --grid: #e1e0d9; --border: rgba(11,11,11,0.08);
  --run: #2a78d6; --swim: #1baf7a; --obj: #d6d5ce;
  --good: #006300; --good-bg: #e3f1e0; --bad: #b42d2d; --bad-bg: #fbe7e5; --neu-bg: #efeee9;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #111110; --card: #1c1c1b; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
    --track: #2c2c2a; --grid: #2c2c2a; --border: rgba(255,255,255,0.07);
    --run: #3987e5; --swim: #199e70; --obj: #383835;
    --good: #3ccf3c; --good-bg: #16301a; --bad: #f08a8a; --bad-bg: #3a1c1c; --neu-bg: #262624;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background: var(--page); color: var(--ink);
  font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding: max(18px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  max-width: 520px; margin: 0 auto;
}
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
h1 { font-size: 26px; margin: 0; letter-spacing: -0.01em; }
.iconbtn { border: 0; background: var(--card); color: var(--ink2); width: 40px; height: 40px; border-radius: 20px; font-size: 19px; cursor: pointer; box-shadow: 0 0 0 1px var(--border); }
.iconbtn.spin { animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.sub { color: var(--ink2); font-size: 14px; }
.muted { color: var(--muted); font-size: 12.5px; }
.period { margin: 4px 0 16px; }
.mbar { height: 6px; background: var(--track); border-radius: 3px; margin-top: 8px; overflow: hidden; }
.mbar > span { display: block; height: 100%; background: var(--muted); border-radius: 3px; }
.card { background: var(--card); border-radius: 20px; padding: 16px; margin-bottom: 12px; box-shadow: 0 0 0 1px var(--border); }
.top { display: flex; gap: 16px; align-items: center; }
.ring { flex-shrink: 0; }
.ring text { font: 600 19px system-ui, sans-serif; fill: var(--ink); }
.ring .lbl { font: 500 10.5px system-ui, sans-serif; fill: var(--muted); }
.sport { font-size: 13px; font-weight: 600; color: var(--ink2); text-transform: uppercase; letter-spacing: 0.06em; }
.vol { font-size: 21px; font-weight: 650; margin: 2px 0 6px; font-variant-numeric: tabular-nums; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--neu-bg); color: var(--ink2); }
.chip.good { background: var(--good-bg); color: var(--good); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
.fact { background: var(--page); border-radius: 12px; padding: 8px 10px; }
.fact b { display: block; font-size: 16px; font-variant-numeric: tabular-nums; }
.fact span { font-size: 12px; color: var(--muted); }
.sec { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin: 16px 0 6px; }
.mk { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid var(--grid); }
.mk:first-of-type { border-top: 0; }
.mk .ic { width: 22px; height: 22px; border-radius: 11px; display: grid; place-items: center; font-size: 13px; font-weight: 700; flex-shrink: 0; background: var(--neu-bg); color: var(--muted); }
.mk .ic.ok { background: var(--good-bg); color: var(--good); }
.mk .t { flex: 1; font-size: 14.5px; }
.mk .a { font-size: 12.5px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.plan svg { display: block; width: 100%; height: auto; }
.plan text { font: 10px system-ui, sans-serif; fill: var(--muted); }
.plan text.cur { fill: var(--ink); font-weight: 700; }
.note { text-align: center; margin-top: 18px; }
.note a, .note button { color: var(--muted); background: none; border: 0; font: inherit; font-size: 12.5px; text-decoration: underline; cursor: pointer; }
.banner { background: var(--neu-bg); color: var(--ink2); border-radius: 12px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; }
.setup input { width: 100%; font: inherit; padding: 12px; border-radius: 12px; border: 1px solid var(--grid); background: var(--card); color: var(--ink); margin: 10px 0; }
.setup button { width: 100%; font: inherit; font-weight: 600; padding: 12px; border-radius: 12px; border: 0; background: var(--run); color: #fff; cursor: pointer; }
.err { color: var(--bad); font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>
<header>
  <h1>Objectifs</h1>
  <button class="iconbtn" id="refresh" aria-label="Actualiser" title="Actualiser">↻</button>
</header>
<main id="app"><p class="sub">Chargement…</p></main>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};

/* Gist : passé dans le lien (#compte/identifiant ou adresse complète), puis mémorisé sur le téléphone. */
function parseGist(s) {
  if (!s) return null;
  s = decodeURIComponent(s).trim().replace(/^#/, '');
  const m = s.match(/([A-Za-z0-9-]+)\/([0-9a-f]{20,})/i);
  return m ? { user: m[1], id: m[2] } : null;
}
let gist = parseGist(location.hash);
if (gist) { store.set('gist', JSON.stringify(gist)); history.replaceState(null, '', location.pathname); }
else { try { gist = JSON.parse(store.get('gist') || 'null'); } catch (e) { gist = null; } }

const donneesLocales = new URLSearchParams(location.search).get('donnees'); // test : ?donnees=widget.json
if (donneesLocales && !gist) gist = { user: 'local', id: 'local' };
async function fetchData() {
  if (donneesLocales) { const r = await fetch(donneesLocales, { cache: 'no-store' }); return r.json(); }
  // l'API GitHub renvoie toujours la dernière version ; l'adresse "raw" sert de secours
  try {
    const r = await fetch(`https://api.github.com/gists/${gist.id}`, { cache: 'no-store' });
    if (r.ok) { const j = await r.json(); const f = j.files && j.files['widget.json']; if (f && f.content) return JSON.parse(f.content); }
  } catch (e) {}
  const r2 = await fetch(`https://gist.githubusercontent.com/${gist.user}/${gist.id}/raw/widget.json?t=${Date.now()}`, { cache: 'no-store' });
  if (!r2.ok) throw new Error('HTTP ' + r2.status);
  return r2.json();
}

const ETAT = {
  atteint: ['good', '✓'], avance: ['good', '↗'], rythme: ['good', '→'], retard: ['bad', '↘'], avant: ['', '⏳'],
};
function ring(pct, color) {
  const r = 38, c = 2 * Math.PI * r, p = Math.max(0, Math.min(100, pct || 0));
  return `<svg class="ring" width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="${p} % de l'objectif">
    <circle cx="48" cy="48" r="${r}" fill="none" stroke="var(--track)" stroke-width="10"/>
    ${p > 0 ? `<circle cx="48" cy="48" r="${r}" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c * (1 - p / 100)).toFixed(1)}" transform="rotate(-90 48 48)"/>` : ''}
    <text x="48" y="52" text-anchor="middle">${p}%</text><text class="lbl" x="48" y="67" text-anchor="middle">du mois</text></svg>`;
}
function planChart(plan, color) {
  if (!plan || !plan.length) return '';
  const W = 320, H = 92, pb = 16, n = plan.length, step = W / n, bw = Math.min(16, step - 6);
  const max = Math.max(...plan.map(p => Math.max(p.obj || 0, p.fait || 0))) || 1;
  const y = v => (H - pb) - v / max * (H - pb - 4);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Plan sur 12 mois : objectif et réalisé">`;
  plan.forEach((p, i) => {
    const x = i * step + (step - bw) / 2;
    s += `<rect x="${x}" y="${y(p.obj)}" width="${bw}" height="${(H - pb) - y(p.obj)}" rx="3" fill="var(--obj)"/>`;
    if (p.fait != null && p.fait > 0) { const iw = bw * 0.55, h = Math.max(2, (H - pb) - y(p.fait)); s += `<rect x="${x + (bw - iw) / 2}" y="${(H - pb) - h}" width="${iw}" height="${h}" rx="2" fill="${color}"/>`; }
    s += `<text x="${x + bw / 2}" y="${H - 3}" text-anchor="middle" class="${p.courant ? 'cur' : ''}">${esc(p.mois.replace('.', ''))}</text>`;
  });
  return s + '</svg>';
}
function sportCard(d, color, unitLabel) {
  if (!d) return '';
  const [cls, ic] = ETAT[d.etat] || ['', '•'];
  const [fait, obj] = String(d.volume).split(' / ');
  const reps = (d.reperes || []).map(r => `<div class="mk"><span class="ic ${r.fait ? 'ok' : ''}" aria-label="${r.fait ? 'atteint' : 'à atteindre'}">${r.fait ? '✓' : ''}</span><span class="t">${esc(r.court || r.texte)}</span><span class="a">${r.fait ? 'atteint' : (r.actuel ? 'actuel ' + esc(r.actuel) : '')}</span></div>`).join('');
  return `<section class="card">
    <div class="top">${ring(d.pct, color)}
      <div style="min-width:0">
        <div class="sport">${esc(d.titre)}</div>
        <div class="vol">${esc(fait)} <span class="muted" style="font-size:14px;font-weight:500">/ ${esc(obj)}</span></div>
        <span class="chip ${cls}">${ic} ${esc(d.statut)}</span>
      </div>
    </div>
    <div class="facts">
      <div class="fact"><b>${esc(d.seances)}</b><span>séances</span></div>
      <div class="fact"><b>${esc(String(d.longue || '').split(' / ')[0])}</b><span>plus longue (obj. ${esc(String(d.longue || '').split(' / ')[1] || '–')})</span></div>
      ${d.par_semaine ? `<div class="fact" style="grid-column:1/-1"><b>${esc(d.par_semaine.replace('≈ ', ''))}</b><span>à faire par semaine pour tenir l’objectif</span></div>` : ''}
    </div>
    ${reps ? `<div class="sec">Repères · ${esc(d.horizon || d.repere_quand || '')}</div>${reps}` : ''}
    ${d.plan ? `<div class="sec">Plan sur 12 mois</div><div class="plan">${planChart(d.plan, color)}</div>` : ''}
  </section>`;
}
function render(data, opts = {}) {
  const app = $('#app');
  app.innerHTML = `
    ${opts.offline ? `<div class="banner">Hors ligne : dernières données reçues (${esc(data.maj)}).</div>` : ''}
    <div class="period">
      <div class="sub"><b style="color:var(--ink)">${esc(data.periode)}</b>${data.rythme_pct > 0 ? ` · encore ${esc(data.jours_restants)} jour${data.jours_restants > 1 ? 's' : ''}` : ''}</div>
      ${data.rythme_pct > 0 ? `<div class="mbar" aria-label="Mois écoulé"><span style="width:${data.rythme_pct}%"></span></div><div class="muted" style="margin-top:4px">Mois écoulé : ${data.rythme_pct} %</div>` : ''}
    </div>
    ${sportCard(data.course, 'var(--run)')}
    ${sportCard(data.natation, 'var(--swim)')}
    <div class="note muted">Mis à jour le ${esc(data.maj)} · <button id="reset">changer de Gist</button></div>`;
  $('#reset').onclick = () => { if (confirm('Oublier le Gist enregistré sur ce téléphone ?')) { store.del('gist'); store.del('data'); location.reload(); } };
}
function renderSetup(msg) {
  $('#app').innerHTML = `<div class="card setup">
    <div style="font-weight:600;font-size:17px">Relier l’app à tes données</div>
    <p class="sub">Colle l’adresse de ta page Gist (dernière ligne de <b>widget-gist.txt</b> sur le PC), par exemple : gist.github.com/compte/identifiant</p>
    <input id="g" type="url" inputmode="url" autocomplete="off" placeholder="https://gist.github.com/compte/identifiant">
    <button id="ok">Enregistrer</button>
    ${msg ? `<div class="err">${esc(msg)}</div>` : ''}
  </div>`;
  $('#ok').onclick = () => { const g = parseGist($('#g').value); if (!g) { renderSetup('Adresse non reconnue. Vérifie qu’elle contient le compte et l’identifiant du Gist.'); return; } store.set('gist', JSON.stringify(g)); gist = g; load(); };
}

let busy = false, lastLoad = 0;
async function load() {
  if (!gist) { renderSetup(); return; }
  if (busy) return; busy = true; $('#refresh').classList.add('spin');
  let cached = null; try { cached = JSON.parse(store.get('data') || 'null'); } catch (e) {}
  if (cached && !lastLoad) render(cached);
  try {
    const data = await fetchData();
    store.set('data', JSON.stringify(data));
    render(data); lastLoad = Date.now();
  } catch (e) {
    if (cached) render(cached, { offline: true });
    else renderSetup('Impossible de lire le Gist (' + e.message + '). Vérifie l’adresse et la connexion.');
  } finally { busy = false; $('#refresh').classList.remove('spin'); }
}
$('#refresh').onclick = load;
document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - lastLoad > 5 * 60 * 1000) load(); });
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
load();
})();
</script>
</body>
</html>
